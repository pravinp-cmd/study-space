<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | Study Space</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #263254;
      background: linear-gradient(135deg, #eef0ff, #fceeff, #e5f8ff);
    }

    .signup-card {
      width: min(100%, 440px);
      padding: 36px;
      border: 1px solid #e3e5fb;
      border-radius: 24px;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 22px 60px rgba(73, 78, 150, .16);
      animation: appear .5s ease both;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #6871e8;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 { margin: 0 0 8px; font-size: 30px; }
    .subtitle { margin: 0 0 26px; color: #77809b; }

    .signup-form p { margin: 0 0 18px; }
    .signup-form label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    .signup-form input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #dce1f1;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
    }

    .signup-form input:focus {
      border-color: #6871e8;
      box-shadow: 0 0 0 4px rgba(104, 113, 232, .13);
    }

    .signup-form ul.helptext {
      padding-left: 18px;
      color: #7d849b;
      font-size: 12px;
    }

    .errorlist {
      padding-left: 18px;
      color: #c43e5c;
      font-size: 13px;
    }

    .submit-button {
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      color: white;
      background: linear-gradient(110deg, #5865e8, #8069e9);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }

    .submit-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(88, 101, 232, .28);
    }

    .login-link {
      margin: 22px 0 0;
      text-align: center;
      color: #77809b;
    }

    a { color: #5865e8; font-weight: 700; }

    @keyframes appear {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .signup-card { padding: 26px 20px; }
    }
  </style>
</head>
<body>
  <main class="signup-card">
    <p class="eyebrow">Your Study Space</p>
    <h1>Create account</h1>
    <p class="subtitle">Sign up to save your study progress.</p>

    <form method="post" class="signup-form">
      {% csrf_token %}
      {{ form.non_field_errors }}
      {{ form.as_p }}
      <button type="submit" class="submit-button">Create account</button>
    </form>

    

    <p class="login-link">
      Already have an account? <a href="{% url 'login' %}">Login</a>
    </p>
  </main>
</body>
</html>
