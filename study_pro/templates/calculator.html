{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Calculator</title>
  <link rel="stylesheet" href="{% static 'css/calculator.css' %}">
  <script src="{% static 'js/calculator.js' %}" defer></script>
</head>

<body>
  <main class="calculator-page">
    <a class="back-link" href="/">← Back to Home</a>

    <section class="calculator-card">
      <p class="eyebrow">STUDY TOOL</p>
      <h1>Calculator</h1>
      <p class="subtitle">Quick calculations for your study time.</p>

      <output id="display" class="display" aria-live="polite">0</output>

      <div class="keypad">
        <button class="key utility" data-action="clear">AC</button>
        <button class="key utility" data-action="sign">+/−</button>
        <button class="key utility" data-action="percent">%</button>
        <button class="key operator" data-operator="/">÷</button>

        <button class="key" data-digit="7">7</button>
        <button class="key" data-digit="8">8</button>
        <button class="key" data-digit="9">9</button>
        <button class="key operator" data-operator="*">×</button>

        <button class="key" data-digit="4">4</button>
        <button class="key" data-digit="5">5</button>
        <button class="key" data-digit="6">6</button>
        <button class="key operator" data-operator="-">−</button>

        <button class="key" data-digit="1">1</button>
        <button class="key" data-digit="2">2</button>
        <button class="key" data-digit="3">3</button>
        <button class="key operator" data-operator="+">+</button>

        <button class="key zero" data-digit="0">0</button>
        <button class="key" data-action="decimal">.</button>
        <button class="key equals" data-action="equals">=</button>
      </div>

      <p class="keyboard-help">Keyboard: numbers, + − × ÷, Enter, Esc</p>
    </section>
  </main>
</body>
</html>
